name: CI

# Runs the offline test suite: tests needing live API keys (Flightradar24,
# Airlabs, TTS providers, S3) skip themselves, everything else must pass.
# The full integration suite still runs via `railway run uv run pytest -v`.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # pydub shells out to ffmpeg for any audio decoding the tests do
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Python version comes from .python-version; --frozen enforces uv.lock
      - name: Sync dependencies
        run: uv sync --frozen

      # -rs prints every skip and its reason, so tests silently skipping
      # (the failure mode this suite is prone to) stay visible in the log
      - name: Run offline test suite
        run: uv run pytest -v -rs
