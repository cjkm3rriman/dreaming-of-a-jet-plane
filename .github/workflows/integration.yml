name: Integration (live APIs)

# The 17 integration tests hit real flight-data APIs and skip themselves
# when keys are missing or the sky is empty. Running them on a schedule with
# -rs makes chronic skips visible instead of silent (DOJP-47 item 6) - a
# suite that has quietly skipped for weeks looks identical to a passing one
# unless someone reads the skip lines.
#
# Requires repository secrets FR24_API_KEY and AIRLABS_API_KEY. Without
# them every test skips - visibly, in the summary below.
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run integration tests
        env:
          FR24_API_KEY: ${{ secrets.FR24_API_KEY }}
          AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
          LIVE_AIRCRAFT_PROVIDER: airlabs
          LIVE_AIRCRAFT_PROVIDER_FALLBACKS: fr24
        run: |
          set -o pipefail  # a tee must never convert a pytest failure into success
          uv run pytest -m integration -v -rs | tee integration.log

      - name: Surface pass/skip counts in the job summary
        if: always()
        run: |
          {
            echo "## Integration run"
            grep -E "^(SKIPPED|FAILED)" integration.log || true
            tail -1 integration.log
            echo ""
            echo "_Skips are the signal here: chronic skipping means the tests have stopped testing._"
          } >> "$GITHUB_STEP_SUMMARY"
